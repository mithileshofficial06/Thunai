<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thunai — துணை</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F766E'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Nirmala UI,sans-serif'%3Eது%3C/text%3E%3C/svg%3E">
  <script src="tailwindcss-play-3.4.17.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-ta">துணை</span><span class="brand-en">Thunai</span>
      <span class="brand-sub" data-i18n="tagline"></span>
    </div>
    <div class="top-actions">
      <button class="pill" data-persona="murugan_family" data-i18n="loadMurugan"></button>
      <button class="pill" data-persona="meena" data-i18n="loadMeena"></button>
      <button class="pill" data-persona="lakshmi_paati" data-i18n="loadLakshmi"></button>
      <button id="speakerBtn" class="pill hidden" title="Speak replies">🔇</button>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button data-lang="ta">தமிழ்</button><button data-lang="en">EN</button>
      </div>
      <button id="clearBtn" class="pill" data-i18n="clear"></button>
    </div>
  </header>

  <!-- ===== Main: 3 columns on desktop, tabs on phones ===== -->
  <main class="layout">
    <!-- Column 1: chat -->
    <section id="col-chat" class="col col-chat" data-tab="chat">
      <div id="consent" class="consent hidden">
        <p data-i18n="consent"></p>
        <button id="consentOk" class="btn-primary" data-i18n="consentOk"></button>
      </div>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <div id="askBox" class="ask-box hidden"></div>
      <form id="chatForm" class="chat-form">
        <button type="button" id="micBtn" class="mic hidden" title="Hold to talk">🎤</button>
        <input id="chatInput" autocomplete="off" data-i18n-placeholder="chatPlaceholder">
        <button class="btn-primary" type="submit" data-i18n="send"></button>
      </form>
    </section>

    <!-- Column 2: family + results -->
    <section id="col-main" class="col col-main" data-tab="family">
      <div class="metrics">
        <div class="metric money">
          <div class="metric-label" data-i18n="rupeesLabel"></div>
          <div class="metric-value"><span id="rupees">₹0</span><small data-i18n="perYear"></small></div>
          <div class="metric-sub" id="schemeCount"></div>
        </div>
        <div class="metric trips" title="">
          <div class="metric-label" data-i18n="tripsLabel"></div>
          <div class="metric-value">🚌 <s id="tripsWithout">0</s> → <span id="tripsWith">0</span></div>
          <div class="metric-sub" data-i18n="tripsHow"></div>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="familyCard"></h2>
        <div id="members" class="members"></div>
        <div id="keyFacts" class="key-facts"></div>
      </div>

      <div id="col-schemes" data-tab="schemes">
        <h2 class="section-title" data-i18n="schemesTitle"></h2>
        <div id="schemes" class="schemes"></div>
      </div>

      <nav class="tabs" id="phase2Tabs">
        <button data-panel="fix" class="active" data-i18n="tabFix"></button>
        <button data-panel="doctor" data-i18n="tabDoctor"></button>
        <button data-panel="letters" data-i18n="tabLetters"></button>
        <button data-panel="helper" data-i18n="tabHelper"></button>
      </nav>
      <div id="panel-fix" class="panel"><p class="muted" data-i18n="comingSoon"></p></div>
      <div id="panel-doctor" class="panel hidden"><p class="muted" data-i18n="comingSoon"></p></div>
      <div id="panel-letters" class="panel hidden"><p class="muted" data-i18n="comingSoon"></p></div>
      <div id="panel-helper" class="panel hidden"><p class="muted" data-i18n="comingSoon"></p></div>
    </section>

    <!-- Column 3: agent panel -->
    <aside id="col-agent" class="col col-agent" data-tab="agent">
      <div class="agent-head">
        <span>🧠 <span data-i18n="agentTitle"></span></span>
        <span class="agent-steps" id="planSteps"></span>
      </div>
      <ol id="agentLog" class="agent-log"></ol>
    </aside>
  </main>

  <!-- Phone bottom tabs -->
  <nav class="bottom-tabs">
    <button data-show="chat" class="active">💬<span data-i18n="mChat"></span></button>
    <button data-show="family">👪<span data-i18n="mFamily"></span></button>
    <button data-show="schemes">✅<span data-i18n="mSchemes"></span></button>
    <button data-show="agent">🧠<span data-i18n="mAgent"></span></button>
  </nav>

  <footer class="footer" data-i18n="footer"></footer>
  <div id="toasts" class="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
