<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | Thunai</title>
<style>
  :root { --ink: #1F2937; --muted: #5B6573; --line: #D5DBE3; --navy: #1B3A6B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9EDF2; color: var(--ink);
         font-family: "Nirmala UI", "Noto Sans Tamil", "Latha", "Segoe UI", system-ui, sans-serif; line-height: 1.6; }
  .toolbar { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line);
             padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .status { font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 4px; border: 1px solid; }
  .status.draft { color: #9A5B00; background: #FFF6E5; border-color: #F0C36D; }
  .status.approved { color: #0F7B3E; background: #E7F6EC; border-color: #8FD1A8; }
  .toolbar button { font: inherit; font-size: 14px; padding: 7px 16px; border-radius: 4px; border: 1px solid var(--navy);
                    background: var(--navy); color: #fff; cursor: pointer; }
  .sheet { position: relative; width: 210mm; max-width: calc(100% - 32px); min-height: 297mm; margin: 20px auto; background: #fff;
           padding: 22mm 20mm; box-shadow: 0 1px 4px rgba(0,0,0,.15); overflow: hidden; }
  .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .watermark span { transform: rotate(-30deg); font-size: 88px; font-weight: 700; color: rgba(180, 35, 24, .10); white-space: nowrap; }
  .letter { position: relative; font-size: 15px; }
  .letter h1 { font-size: 18px; margin: 0 0 4px; color: var(--navy); }
  .letter h2 { font-size: 16px; margin: 18px 0 6px; }
  .letter .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .letter p { margin: 8px 0; }
  .letter ul { margin: 6px 0 6px 20px; padding: 0; }
  .letter .block { white-space: pre-line; }
  .letter .sign { display: flex; justify-content: space-between; margin-top: 28px; }
  .letter .box { border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; margin: 12px 0; }
  .letter .blank { color: var(--muted); }
  .divider { border: 0; border-top: 1px dashed var(--line); margin: 28px 0; }
  .footer { margin-top: 26px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet { margin: 0; box-shadow: none; width: auto; max-width: none; min-height: 0; padding: 0; }
    .divider { page-break-after: always; border: 0; margin: 0; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div><strong>{{title}}</strong></div>
    <div style="display:flex;gap:12px;align-items:center">{{status}}{{print}}</div>
  </div>
  <div class="sheet">
    {{watermark}}
    <div class="letter">
      {{body_ta}}
      <hr class="divider">
      {{body_en}}
      <div class="footer">{{footer}}</div>
    </div>
  </div>
</body>
</html>
